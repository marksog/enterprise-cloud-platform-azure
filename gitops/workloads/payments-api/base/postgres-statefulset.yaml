apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres-payments
  labels:
    app.kubernetes.io/name: postgres-payments
    sog.io/domain: commerce
spec:
  serviceName: postgres-payments
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: postgres-payments

  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres-payments
        sog.io/domain: commerce

    spec:
      terminationGracePeriodSeconds: 60

      securityContext:
        fsGroup: 999

      containers:
        - name: postgres
          image: postgres:16

          ports:
            - name: postgres
              containerPort: 5432

          env:
            - name: POSTGRES_DB
              value: paymentsdb

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: payments-db-credentials
                  key: username

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: payments-db-credentials
                  key: password

            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

          readinessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            exec:
              command:
                - /bin/sh
                - -c
                - pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"
            initialDelaySeconds: 30
            periodSeconds: 20

          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes:
          - ReadWriteOnce
        storageClassName: sog-managed-disk
        resources:
          requests:
            storage: 5Gi
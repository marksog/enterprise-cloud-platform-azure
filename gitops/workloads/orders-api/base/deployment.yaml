apiVersion: apps/v1
kind: Deployment
metadata:
  name: orders-api
  namespace: sog-nonprod-commerce
  labels:
    app.kubernetes.io/name: orders-api
    sog.io/domain: commerce

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: orders-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: orders-api
        sog.io/domain: commerce
        azure.workload.identity/use: "true"

    spec:
      serviceAccountName: orders-api

      containers:
        - name: orders-api
          image: sogplatformacr.azurecr.io/orders-api:v1

          ports:
            - name: http
              containerPort: 8080

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
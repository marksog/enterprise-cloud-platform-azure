apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: orders-api
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/marksog/enterprise-cloud-platform-azure.git
    targetRevision: main
    path: gitops/workloads/orders-api/overlays/nonprod

  destination:
    server: https://kubernetes.default.svc
    namespace: sog-nonprod-commerce

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=false
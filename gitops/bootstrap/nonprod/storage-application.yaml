apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: platform-storage
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/marksog/enterprise-cloud-platform-azure.git
    targetRevision: main
    path: gitops/platform/storage/nonprod

  destination:
    server: https://kubernetes.default.svc
    namespace: default

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - ServerSideApply=true
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: alloy
  namespace: argocd

spec:
  project: default

  sources:
    - repoURL: https://grafana.github.io/helm-charts
      chart: alloy
      targetRevision: 1.13.0

      helm:
        releaseName: sog-alloy

        valueFiles:
          - $values/gitops/platform/observability/logging/nonprod/alloy-values.yaml

    - repoURL: https://github.com/marksog/enterprise-cloud-platform-azure.git
      targetRevision: main
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: sog-nonprod-observability

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: commerce-test-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/marksog/enterprise-cloud-platform-azure.git
    targetRevision: main
    path: gitops/workloads/commerce-test-api/overlays/nonprod
  destination:
    server: https://kubernetes.default.svc
    namespace: sog-dev-commerce
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
    - CreateNamespace=false

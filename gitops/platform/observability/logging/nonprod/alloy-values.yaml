# ============================================================
# SOG PLATFORM - GRAFANA ALLOY
# Environment: NonProd
#
# Responsibility:
#   Discover Kubernetes Pods
#   Collect application stdout/stderr
#   Enrich logs with Kubernetes metadata
#   Forward logs to Loki
#
# Managed by Argo CD.
# ============================================================

controller:
  type: daemonset

serviceAccount:
  create: true

rbac:
  create: true

alloy:
  stabilityLevel: generally-available

  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

  configMap:
    create: true

    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Discover Pods on the same node as this Alloy instance.
      discovery.kubernetes "pods" {
        role = "pod"

        selectors {
          role  = "pod"
          field = "spec.nodeName=" + sys.env("NODE_NAME")
        }
      }

      // Enrich discovered targets with Kubernetes metadata.
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "service"
        }

        rule {
          source_labels = ["__meta_kubernetes_pod_label_sog_io_domain"]
          target_label  = "domain"
        }
      }

      // Read container logs using the Kubernetes API.
      loki.source.kubernetes "pod_logs" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.process.pod_logs.receiver]
      }

      // Add platform metadata.
      loki.process "pod_logs" {
        stage.static_labels {
          values = {
            cluster     = "sog-nonprod-aks",
            environment = "nonprod",
          }
        }

        forward_to = [loki.write.default.receiver]
      }

      // Forward collected logs to Loki.
      loki.write "default" {
        endpoint {
          url = "http://sog-loki-gateway.sog-nonprod-observability.svc.cluster.local/loki/api/v1/push"
        }
      }

  extraEnv:
    - name: NODE_NAME
      valueFrom:
        fieldRef:
          fieldPath: spec.nodeName
# ============================================================
# SOG PLATFORM - LOKI
# Environment: NonProd
#
# Architecture:
#   Monolithic Loki
#   Single replica
#   Azure Disk persistence
#   7-day retention
#
# Managed by Argo CD.
# ============================================================

deploymentMode: Monolithic

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 168h
    allow_structured_metadata: true

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

  pattern_ingester:
    enabled: false

singleBinary:
  replicas: 1

  persistence:
    enabled: true
    storageClass: sog-managed-disk
    accessModes:
      - ReadWriteOnce
    size: 10Gi
    enableStatefulSetAutoDeletePVC: false

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# Disable distributed components.
backend:
  replicas: 0

read:
  replicas: 0

write:
  replicas: 0

ingester:
  replicas: 0

querier:
  replicas: 0

queryFrontend:
  replicas: 0

queryScheduler:
  replicas: 0

distributor:
  replicas: 0

compactor:
  replicas: 0

indexGateway:
  replicas: 0

bloomPlanner:
  replicas: 0

bloomBuilder:
  replicas: 0

bloomGateway:
  replicas: 0

# Keep the lab lightweight.
chunksCache:
  enabled: false

resultsCache:
  enabled: false

lokiCanary:
  enabled: false

test:
  enabled: false

minio:
  enabled: false

gateway:
  enabled: true

  service:
    type: ClusterIP

  resources:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
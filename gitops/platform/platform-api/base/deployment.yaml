apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: sog-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: sog-platform
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: platform-api
          image: sogplatformacr.azurecr.io/platform-api@sha256:30c1cbf9eee29354d8f504b1aa6003fedcd989a70d9d044e41efadd4ac4cec81
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: SOG_ENTRA_TENANT_ID
              value: "b854e21e-defb-4268-8398-05ca9757a1af"
            - name: SOG_ENTRA_API_CLIENT_ID
              value: "c705d7f9-8c81-4649-88b4-55b530b50353"
            - name: OPA_URL
              value: "http://127.0.0.1:8181/v1/data/sog/workload/decision"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

        - name: opa
          image: openpolicyagent/opa:1.4.2-static
          imagePullPolicy: IfNotPresent

          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - /policies/workload.rego

          ports:
            - name: opa
              containerPort: 8181

          volumeMounts:
            - name: opa-policy
              mountPath: /policies
              readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          readinessProbe:
            httpGet:
              path: /health?plugins
              port: opa
            periodSeconds: 10

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      volumes:
        - name: opa-policy
          configMap:
            name: platform-api-opa-policy

apiVersion: apps/v1
kind: Deployment
metadata:
  name: platform-api
  labels:
    app.kubernetes.io/name: platform-api
    app.kubernetes.io/part-of: sog-platform

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: platform-api

  template:
    metadata:
      labels:
        app.kubernetes.io/name: platform-api
        app.kubernetes.io/part-of: sog-platform

    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault

      containers:

        # ==========================================
        # PLATFORM API CONTAINER
        # ==========================================
        - name: platform-api
          image: sogplatformacr.azurecr.io/platform-api@sha256:7c25c5f51278ac6174bfc204278888ee1810608262072dcc19874ee643b08cb3
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: SOG_ENTRA_TENANT_ID
              value: "b854e21e-defb-4268-8398-05ca9757a1af"

            - name: SOG_ENTRA_API_CLIENT_ID
              value: "c705d7f9-8c81-4649-88b4-55b530b50353"

            - name: OPA_URL
              value: "http://127.0.0.1:8181/v1/data/sog/workload/decision"

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi

          # Checks whether the API has started
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            failureThreshold: 24

          # Checks whether the API is ready
          # The API must also verify OPA availability
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 3

          # Checks whether the API is alive
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 20
            timeoutSeconds: 3

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

        # ==========================================
        # OPA AUTHORIZATION SIDECAR
        # ==========================================
        - name: opa
          image: openpolicyagent/opa:1.4.2-static
          imagePullPolicy: IfNotPresent

          args:
            - run
            - --server
            - --addr=127.0.0.1:8181
            - /policies/workload.rego

          ports:
            - name: opa
              containerPort: 8181

          volumeMounts:
            - name: opa-policy
              mountPath: /policies
              readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi

          # No separate OPA readiness probe.
          # Platform API /ready checks the OPA dependency.

          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL

      # ==========================================
      # OPA POLICY CONFIGURATION
      # ==========================================
      volumes:
        - name: opa-policy
          configMap:
            name: platform-api-opa-policy
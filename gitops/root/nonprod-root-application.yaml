apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: nonprod-root
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/marksog/enterprise-cloud-platform-azure.git
    targetRevision: main
    path: gitops/bootstrap/nonprod

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
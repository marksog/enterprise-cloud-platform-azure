name: Payments API - CI

on:
  pull_request:
    paths:
      - "apps/payments-api/**"
      - ".github/workflows/payments-api-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/payments-api/**"
      - ".github/workflows/payments-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Payments API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/payments-api

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: payments
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: paymentsdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U payments -d paymentsdb"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://payments:testpassword@localhost:5432/paymentsdb

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/payments-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application imports
        run: python -c "from app.main import app; print(app.title)"

      - name: Start application
        run: |
          uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8080 > /tmp/payments-api.log 2>&1 &
          echo $! > /tmp/payments-api.pid

      - name: Wait for readiness
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8080/ready; then
              exit 0
            fi
            sleep 1
          done

          cat /tmp/payments-api.log
          exit 1

      - name: Test payment creation
        run: |
          curl --fail --silent \
            -X POST http://127.0.0.1:8080/payments \
            -H "Content-Type: application/json" \
            -d '{"order_id":"ORD-CI-001","amount":"25.00","currency":"USD"}'

      - name: Test metrics endpoint
        run: |
          curl --fail --silent http://127.0.0.1:8080/metrics \
            | grep "payments_created_total"

  build-and-push:
    name: Build and Push Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    env:
      ACR_NAME: sogplatformacr
      ACR_LOGIN_SERVER: sogplatformacr.azurecr.io
      IMAGE_NAME: payments-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_COMMERCE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SHARED_SERVICES_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Generate image metadata
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$ACR_LOGIN_SERVER/$IMAGE_NAME:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: apps/payments-api
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Push image
        run: docker push "${{ steps.image.outputs.image }}"

      - name: Show published image
        run: |
          echo "Published:"
          echo "${{ steps.image.outputs.image }}"
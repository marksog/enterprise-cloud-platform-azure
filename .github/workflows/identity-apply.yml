name: Identity - Apply

on:
  push:
    branches:
      - main
    paths:
      - "terraform/identity/**"
      - ".github/workflows/identity-apply.yml"

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: identity-terraform-state
  cancel-in-progress: false

jobs:
  plan:
    name: Deployment Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/identity

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_IDENTITY_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_NETWORKING_SUBSCRIPTION_ID }}

      TF_VAR_prod_subscription_id: ${{ vars.AZURE_PROD_SUBSCRIPTION_ID }}
      TF_VAR_nonprod_subscription_id: ${{ vars.AZURE_NONPROD_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_IDENTITY_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_NETWORKING_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -out=identity.tfplan

      - name: Upload Terraform Plan
        uses: actions/upload-artifact@v4
        with:
          name: identity-tfplan
          path: terraform/identity/identity.tfplan
          if-no-files-found: error
          retention-days: 1

  apply:
    name: Terraform Apply
    needs: plan
    runs-on: ubuntu-latest

    environment:
      name: tenant-governance

    defaults:
      run:
        working-directory: terraform/identity

    env:
      ARM_USE_OIDC: true
      ARM_USE_AZUREAD: true
      ARM_CLIENT_ID: ${{ vars.AZURE_IDENTITY_DEPLOY_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_NETWORKING_SUBSCRIPTION_ID }}

      TF_VAR_prod_subscription_id: ${{ vars.AZURE_PROD_SUBSCRIPTION_ID }}
      TF_VAR_nonprod_subscription_id: ${{ vars.AZURE_NONPROD_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_IDENTITY_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_NETWORKING_SUBSCRIPTION_ID }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Download Terraform Plan
        uses: actions/download-artifact@v4
        with:
          name: identity-tfplan
          path: terraform/identity

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve identity.tfplan
name: Orders API - CI

on:
  pull_request:
    paths:
      - "apps/orders-api/**"
      - ".github/workflows/orders-api-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/orders-api/**"
      - ".github/workflows/orders-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Orders API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/orders-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/orders-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application imports
        run: python -c "from app.main import app; print(app.title)"

      - name: Start application
        run: |
          uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8080 > /tmp/orders-api.log 2>&1 &
          echo $! > /tmp/orders-api.pid

      - name: Wait for health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi

            sleep 1
          done

          cat /tmp/orders-api.log
          exit 1

      - name: Test root endpoint
        run: curl --fail http://127.0.0.1:8080/

      - name: Test Prometheus metrics endpoint
        run: |
          curl --fail --silent http://127.0.0.1:8080/metrics \
            | grep "orders_api_http_requests_total"

  build-and-push:
    name: Build and Push Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: write
      id-token: write
      pull-requests: write

    env:
      ACR_NAME: sogplatformacr
      ACR_LOGIN_SERVER: sogplatformacr.azurecr.io
      IMAGE_NAME: orders-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_COMMERCE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SHARED_SERVICES_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Generate image metadata
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$ACR_LOGIN_SERVER/$IMAGE_NAME:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: apps/orders-api
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Push image
        run: docker push "${{ steps.image.outputs.image }}"

      - name: Show published image
        run: |
          echo "Published:"
          echo "${{ steps.image.outputs.image }}"

      - name: Install Kustomize
        env:
          KUSTOMIZE_VERSION: "5.7.1"
        run: |
          curl -fsSLo /tmp/kustomize.tar.gz \
            "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz"

          tar -xzf /tmp/kustomize.tar.gz -C /tmp
          sudo install /tmp/kustomize /usr/local/bin/kustomize

          kustomize version

      - name: Update NonProd image tag
        env:
          IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
        run: |
          cd gitops/workloads/orders-api/overlays/nonprod

          kustomize edit set image \
            sogplatformacr.azurecr.io/orders-api=sogplatformacr.azurecr.io/orders-api:${IMAGE_TAG}

      - name: Show promotion change
        run: |
          git diff -- \
            gitops/workloads/orders-api/overlays/nonprod/kustomization.yaml

      - name: Create NonProd promotion pull request
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE_TAG: ${{ steps.image.outputs.short_sha }}
        run: |
          BRANCH="promote/orders-api-${IMAGE_TAG}-nonprod"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git switch -c "$BRANCH"

          git add \
            gitops/workloads/orders-api/overlays/nonprod/kustomization.yaml

          git commit \
            -m "chore(orders-api): promote ${IMAGE_TAG} to nonprod"

          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "chore(orders-api): promote ${IMAGE_TAG} to nonprod" \
            --body "Promotes the immutable orders-api image \`${IMAGE_TAG}\` to NonProd."
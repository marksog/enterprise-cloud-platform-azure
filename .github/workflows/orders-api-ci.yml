name: Orders API - CI

on:
  pull_request:
    paths:
      - "apps/orders-api/**"
      - ".github/workflows/orders-api-ci.yml"

  push:
    branches:
      - main
    paths:
      - "apps/orders-api/**"
      - ".github/workflows/orders-api-ci.yml"

permissions:
  contents: read

jobs:
  test:
    name: Test Orders API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/orders-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/orders-api/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify application imports
        run: python -c "from app.main import app; print(app.title)"

      - name: Start application
        run: |
          uvicorn app.main:app \
            --host 127.0.0.1 \
            --port 8080 > /tmp/orders-api.log 2>&1 &
          echo $! > /tmp/orders-api.pid

      - name: Wait for health endpoint
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8080/health; then
              exit 0
            fi

            sleep 1
          done

          cat /tmp/orders-api.log
          exit 1

      - name: Test root endpoint
        run: curl --fail http://127.0.0.1:8080/

  build-and-push:
    name: Build and Push Image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: sogplatformacr
      ACR_LOGIN_SERVER: sogplatformacr.azurecr.io
      IMAGE_NAME: orders-api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_COMMERCE_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SHARED_SERVICES_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name "$ACR_NAME"

      - name: Generate image metadata
        id: image
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"

          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "image=$ACR_LOGIN_SERVER/$IMAGE_NAME:$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Build image
        working-directory: apps/orders-api
        run: |
          docker build \
            --tag "${{ steps.image.outputs.image }}" \
            .

      - name: Push image
        run: docker push "${{ steps.image.outputs.image }}"

      - name: Show published image
        run: |
          echo "Published:"
          echo "${{ steps.image.outputs.image }}"
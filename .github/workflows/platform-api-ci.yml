name: SOG Platform API CI

on:
  pull_request:
    paths:
      - "platform/**"
      - "compose.yaml"
      - ".github/workflows/platform-api-ci.yml"

  push:
    branches:
      - main
      - feat/platform-api-foundation
    paths:
      - "platform/**"
      - "compose.yaml"
      - ".github/workflows/platform-api-ci.yml"

permissions:
  contents: read

concurrency:
  group: platform-api-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ==========================================================
  # JOB 1: PLATFORM API TESTS
  # ==========================================================

  platform-tests:
    name: Platform API Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: platform/api/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r platform/api/requirements.txt
          python -m pip install pytest

      - name: Validate Python syntax
        run: |
          python -m compileall -q platform/api/app
          python -m compileall -q platform/generator

      - name: Run Platform API unit tests
        working-directory: platform/api
        run: |
          python -m pytest tests/ -v

      - name: Validate generated Terraform and GitOps
        run: |
          python platform/generator/validate_change_set.py

  # ==========================================================
  # JOB 2: OPA POLICY VALIDATION
  # ==========================================================

  opa-validation:
    name: OPA Policy Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install OPA
        run: |
          OPA_VERSION="1.8.0"

          curl -fsSL \
            "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static" \
            -o opa

          chmod +x opa
          sudo mv opa /usr/local/bin/opa

          opa version

      - name: Validate Rego syntax
        run: |
          opa check --strict platform/policies/

      - name: Verify authorized developer is allowed
        run: |
          cat > /tmp/opa-input.json <<'EOF'
          {
            "identity": {
              "groups": ["commerce-developers"]
            },
            "workload": {
              "name": "inventory-api",
              "domain": "commerce",
              "environment": "dev",
              "size": "small"
            }
          }
          EOF

          DECISION=$(opa eval \
            --format raw \
            --data platform/policies/ \
            --input /tmp/opa-input.json \
            'data.sog.workload.decision')

          echo "OPA decision: $DECISION"

          if [ "$DECISION" != "allow" ]; then
            echo "ERROR: Expected allow, received $DECISION"
            exit 1
          fi

          echo "Authorized developer: PASSED"

      - name: Verify unauthorized developer is denied
        run: |
          cat > /tmp/opa-input.json <<'EOF'
          {
            "identity": {
              "groups": ["finance-developers"]
            },
            "workload": {
              "name": "inventory-api",
              "domain": "commerce",
              "environment": "dev",
              "size": "small"
            }
          }
          EOF

          DECISION=$(opa eval \
            --format raw \
            --data platform/policies/ \
            --input /tmp/opa-input.json \
            'data.sog.workload.decision')

          echo "OPA decision: $DECISION"

          if [ "$DECISION" != "deny" ]; then
            echo "ERROR: Expected deny, received $DECISION"
            exit 1
          fi

          echo "Unauthorized developer: PASSED"

  # ==========================================================
  # JOB 3: CONTAINER INTEGRATION TESTS
  # ==========================================================

  container-integration:
    name: Container Integration Tests
    runs-on: ubuntu-latest

    needs:
      - platform-tests
      - opa-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Build and start containers
      # ------------------------------------------------------

      - name: Build and start platform services
        run: |
          docker compose -f compose.yaml up --build -d

      # ------------------------------------------------------
      # Verify API readiness
      # ------------------------------------------------------

      - name: Wait for API readiness
        run: |
          echo "Waiting for FastAPI and OPA..."

          for i in $(seq 1 30); do

            if curl --fail --silent \
              http://127.0.0.1:8001/ready > /dev/null; then

              echo "Platform is ready"
              exit 0
            fi

            echo "Attempt $i: Platform not ready"
            sleep 2

          done

          echo "ERROR: Platform failed readiness"
          exit 1

      # ------------------------------------------------------
      # Verify API liveness
      # ------------------------------------------------------

      - name: Verify API liveness
        run: |
          curl --fail --show-error \
            http://127.0.0.1:8001/health

      # ------------------------------------------------------
      # Test real OPA authorization
      # ------------------------------------------------------

      - name: Verify OPA allow and deny decisions
        run: |
          docker compose -f compose.yaml exec -T api python - <<'PY'
          import httpx

          url = "http://opa:8181/v1/data/sog/workload/decision"

          workload = {
              "name": "inventory-api",
              "domain": "commerce",
              "environment": "dev",
              "size": "small",
          }

          test_cases = [
              ("commerce-developers", "allow"),
              ("finance-developers", "deny"),
          ]

          for group, expected in test_cases:

              payload = {
                  "input": {
                      "identity": {
                          "groups": [group]
                      },
                      "workload": workload,
                  }
              }

              response = httpx.post(
                  url,
                  json=payload,
                  timeout=5,
              )

              response.raise_for_status()

              actual = response.json().get("result")

              print(
                  f"Group: {group}, "
                  f"Expected: {expected}, "
                  f"Actual: {actual}"
              )

              assert actual == expected, (
                  f"Authorization failed for {group}: "
                  f"expected {expected}, got {actual}"
              )

          print("OPA authorization integration: PASSED")
          PY

      # ------------------------------------------------------
      # Simulate OPA failure
      # ------------------------------------------------------

      - name: Stop OPA
        run: |
          docker compose -f compose.yaml stop opa

      - name: Verify readiness fails closed
        run: |
          echo "Testing API behavior when OPA is unavailable..."

          health_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/health)

          ready_status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:8001/ready)

          echo "Health status: $health_status"
          echo "Readiness status: $ready_status"

          if [ "$health_status" != "200" ]; then
            echo "ERROR: API health endpoint should remain healthy"
            exit 1
          fi

          if [ "$ready_status" != "503" ]; then
            echo "ERROR: API readiness should return 503 when OPA is unavailable"
            exit 1
          fi

          echo "PASS: API remains alive but is not ready when OPA fails"

  # ==========================================================
  # JOB 4: CONTAINER SECURITY
  # ==========================================================

  container-security:
    name: Container Security Scan
    runs-on: ubuntu-latest

    needs:
      - platform-tests
      - opa-validation

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Platform API image
        run: docker compose -f compose.yaml build api

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.76.1

          trivy --version

      - name: Generate vulnerability report
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-platform-api.json \
            sog-platform-api:dev

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-api-trivy-report
          path: trivy-platform-api.json
          if-no-files-found: error

      - name: Block fixable HIGH and CRITICAL vulnerabilities
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            sog-platform-api:dev

  # ==========================================================
  # JOB 5: SECURE ACR PUBLISHING
  # ==========================================================

  publish-platform-api:
    name: Publish Platform API to ACR
    runs-on: ubuntu-latest

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - platform-tests
      - opa-validation
      - container-integration
      - container-security

    permissions:
      contents: read
      id-token: write

    env:
      ACR_NAME: sogplatformacr
      ACR_LOGIN_SERVER: sogplatformacr.azurecr.io
      IMAGE_NAME: platform-api
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Build exactly one release image.
      - name: Build release image
        run: |
          docker build \
            -f platform/api/Dockerfile \
            -t "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}" \
            .

      # Install the same Trivy version used in our CI security gate.
      - name: Install Trivy
        run: |
          curl -sfL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin v0.76.1

          trivy --version

      # Produce a complete HIGH/CRITICAL vulnerability report.
      - name: Generate vulnerability report
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --format json \
            --output trivy-release-report.json \
            "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"

      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: platform-api-release-security-report
          path: trivy-release-report.json
          if-no-files-found: error

      # Stop publishing if fixable HIGH/CRITICAL vulnerabilities exist.
      - name: Enforce vulnerability security gate
        run: |
          trivy image \
            --scanners vuln \
            --severity HIGH,CRITICAL \
            --ignore-unfixed \
            --exit-code 1 \
            "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"

      # Authenticate without storing an Azure client secret.
      - name: Authenticate to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_PLATFORM_CI_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SHARED_SERVICES_SUBSCRIPTION_ID }}

      - name: Authenticate Docker to ACR
        run: |
          az acr login --name "$ACR_NAME"

      # Push the exact image that passed the security scan.
      - name: Push approved image
        run: |
          docker push \
            "${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"

      # Obtain the registry manifest digest.
      - name: Capture published image digest
        id: digest
        run: |
          IMAGE_REF="${ACR_LOGIN_SERVER}/${IMAGE_NAME}:${IMAGE_TAG}"

          DIGEST=$(docker image inspect \
            "$IMAGE_REF" \
            --format '{{index .RepoDigests 0}}' \
            | cut -d@ -f2)

          test -n "$DIGEST"
          test "${DIGEST#sha256:}" != "$DIGEST"

          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Published digest: $DIGEST"

      # Confirm that the published image is retrievable by digest.
      - name: Verify published image integrity
        run: |
          IMAGE_REF="${ACR_LOGIN_SERVER}/${IMAGE_NAME}@${{ steps.digest.outputs.digest }}"

          docker pull "$IMAGE_REF"
          docker image inspect "$IMAGE_REF" >/dev/null

          echo "Image verified by immutable digest."

      # Record the immutable deployment reference.
      - name: Generate approved image reference
        run: |
          echo "${ACR_LOGIN_SERVER}/${IMAGE_NAME}@${{ steps.digest.outputs.digest }}" \
            > approved-image.txt

          cat approved-image.txt

      - name: Upload approved image reference
        uses: actions/upload-artifact@v4
        with:
          name: platform-api-approved-image
          path: approved-image.txt
          if-no-files-found: error
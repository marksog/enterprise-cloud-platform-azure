name: sog-platform

services:
  api:
    build:
      context: .
      dockerfile: platform/api/Dockerfile

    image: sog-platform-api:dev

    ports:
      - "127.0.0.1:8001:8000"

    environment:
      OPA_URL: http://opa:8181/v1/data/sog/workload/decision

    depends_on:
      opa:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - platform-network

    security_opt:
      - no-new-privileges:true

  opa:
    image: openpolicyagent/opa:1.4.2

    command:
      - run
      - --server
      - --addr=0.0.0.0:8181
      - /policies/workload.rego

    volumes:
      - ./platform/policies:/policies:ro

    expose:
      - "8181"

    healthcheck:
      test:
        - CMD
        - /opa
        - eval
        - "true"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    restart: unless-stopped

    networks:
      - platform-network

    security_opt:
      - no-new-privileges:true

networks:
  platform-network:
    driver: bridge